<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Skill & Internship Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Skill & Internship Tracker</h1>
        <p>Manage your skills and internship applications</p>
    </header>

    <nav>
        <button onclick="showSection('dashboard')">Dashboard</button>
        <button onclick="showSection('skills')">Skills</button>
        <button onclick="showSection('internships')">Internships</button>
        <button onclick="showSection('applications')">Applications</button>
    </nav>

    <main>

        <section id="dashboard" class="section">
            <h2>Dashboard</h2>

            <div class="cards">
                <div class="card">
                    <h3 id="skillCount">0</h3>
                    <p>Skills</p>
                </div>

                <div class="card">
                    <h3 id="internshipCount">0</h3>
                    <p>Internships</p>
                </div>

                <div class="card">
                    <h3 id="applicationCount">0</h3>
                    <p>Applications</p>
                </div>
            </div>
        </section>

        <section id="skills" class="section">
            <h2>My Skills</h2>

            <input type="text" id="skillInput" placeholder="Enter a skill">
            <button onclick="addSkill()">Add Skill</button>

            <ul id="skillList"></ul>
        </section>

        <section id="internships" class="section">
            <h2>Internships</h2>

            <input type="text" id="companyInput" placeholder="Company name">
            <input type="text" id="roleInput" placeholder="Role">
            <button onclick="addInternship()">Add Internship</button>

            <div id="internshipList"></div>
        </section>

        <section id="applications" class="section">
            <h2>My Applications</h2>

            <div id="applicationList">
                <p>No applications yet.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>Student Skill & Internship Tracker | FSD-2 Project</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
